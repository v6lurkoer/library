<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Template</title>
    <meta charset="UTF-8"/>
    <link href="./style.css" rel="stylesheet"/>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div id="containerLeft">
      <div class="entrySection">
        <button id="addBookButton">ADD BOOK</button>
        <div id="formSection">
          <form id="bookForm" action="" method="get">
            <fieldset>
              <label for="title">Title</label>
              <input id="title" type="text" name="title"/>
            </fieldset>
            <fieldset>
              <label for="author">Author</label>
              <input id="author" type="text" name="author"/>
            </fieldset>
            <fieldset>
              <label for="pages">Number of pages</label>
              <input id="pages" type="number" name="pages" min="0"/>
            </fieldset>
            <fieldset id="radio">
              <legend>Have you read the book?</legend>
              <label><input id="isRead" type="radio" name="read" value="yes" required /> Yes</label>
              <label><input id="isntRead" type="radio" name="read" value="no" required checked /> No</label>
            </fieldset>
          </form>
          <div id="submitButtonContainer">
            <button id="submitButton" onclick="submit()">Submit</button>
          </div>
        </div>
      </div>
    </div>
    <div id="containerRight">
      <h1>Your books</h1>
      <div id="tableSection">
        <table>
          <thead>
            <tr id="idForColumnCount">
              <th scope="col">No</th>
              <th scope="col">Title</th>
              <th scope="col">Author</th>
              <th scope="col">Number of pages</th>
              <th scope="col">Read</th>
              <th scope="col">ID</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
